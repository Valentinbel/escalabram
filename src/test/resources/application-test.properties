# Configuration pour la base de données H2 en mode mémoire
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.platform=h2
spring.datasource.username=sa
spring.datasource.password=

# Hibernate (ou JPA) configuration
spring.jpa.hibernate.ddl-auto=create-drop

## VERIFIER CE QUE CA FAIT? !!!!!!!!!!
spring.jpa.properties.hibernate.check_nullability=false
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
